<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Associati Sistema Trasporti</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f0f2f7;
    --card: #ffffff;
    --primary: #4b2fa0;
    --primary2: #00c8c8;
    --text: #1e2535;
    --muted: #6b7280;
    --border: #e2e8f0;
    --auto: #5b3fd4;
    --bus: #0f9688;
    --misto: #7c3aed;
    --radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0;
      --muted: #94a3b8; --border: #334155;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #3d1fa8 0%, #4b8fc4 60%, #00c8c8 100%);
    padding: 12px 16px 10px;
    position: sticky; top: env(safe-area-inset-top,0); z-index: 200;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .header-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .header-top img { height:36px; filter:brightness(0) invert(1); object-fit:contain; }
  .header-count { margin-left:auto; background:rgba(255,255,255,0.18); border-radius:20px; padding:3px 11px; font-size:13px; font-weight:700; color:#fff; white-space:nowrap; }

  .search-bar { display:flex; gap:8px; }
  .search-bar input {
    flex:1; border:none; border-radius:9px; padding:9px 14px;
    font-size:15px; background:rgba(255,255,255,0.18); color:#fff; outline:none;
  }
  .search-bar input::placeholder { color:rgba(255,255,255,0.6); }
  .search-bar input:focus { background:rgba(255,255,255,0.28); }

  .filters { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
  .filter-btn {
    border:none; border-radius:20px; padding:5px 14px; font-size:13px;
    font-weight:600; cursor:pointer; transition:all .2s;
    background:rgba(255,255,255,0.18); color:#fff;
  }
  .filter-btn.active { background:#00c8c8; color:#0a0a2a; }

  /* VIEW TOGGLE */
  .view-toggle {
    display:flex; background:rgba(255,255,255,0.15); border-radius:9px; overflow:hidden; margin-left:auto;
  }
  .view-btn {
    border:none; background:transparent; color:rgba(255,255,255,0.7);
    padding:7px 13px; cursor:pointer; font-size:16px; transition:all .2s;
  }
  .view-btn.active { background:rgba(255,255,255,0.3); color:#fff; }

  /* REGION CHIPS */
  .region-bar {
    background:var(--card); border-bottom:1px solid var(--border);
    padding:7px 12px; overflow-x:auto; white-space:nowrap;
    display:flex; gap:6px;
  }
  .region-chip {
    display:inline-block; border:1.5px solid var(--border); border-radius:20px;
    padding:4px 12px; font-size:12px; font-weight:600; cursor:pointer;
    color:var(--muted); background:var(--card); white-space:nowrap; transition:all .2s;
  }
  .region-chip.active { border-color:var(--primary); color:var(--primary); background:#ede9fe; }

  .results-info { padding:8px 14px 2px; font-size:13px; color:var(--muted); font-weight:500; }

  /* MAP VIEW */
  #map-container { display:none; height:calc(100vh - 200px); }
  #map { height:100%; width:100%; }

  /* CARDS VIEW */
  #cards-container { display:block; }
  .cards { padding:8px 10px 90px; display:grid; gap:10px; }
  @media(min-width:600px){ .cards{grid-template-columns:repeat(2,1fr)} }
  @media(min-width:900px){ .cards{grid-template-columns:repeat(3,1fr)} }

  /* CARD */
  .card {
    background:var(--card); border-radius:var(--radius); border:1px solid var(--border);
    overflow:hidden; transition:box-shadow .2s, transform .15s;
  }
  .card:hover { box-shadow:0 4px 20px rgba(0,0,0,0.1); transform:translateY(-1px); }
  .card-top { display:flex; align-items:flex-start; gap:10px; padding:13px 14px 8px; }
  .cat-stripe { width:4px; border-radius:4px; align-self:stretch; flex-shrink:0; min-height:40px; }
  .cat-2 .cat-stripe { background:var(--auto); }
  .cat-4 .cat-stripe { background:var(--bus); }
  .cat-6 .cat-stripe { background:var(--misto); }
  .card-icon { font-size:20px; flex-shrink:0; }
  .card-title { font-size:14px; font-weight:700; line-height:1.3; }
  .card-badge {
    display:inline-block; font-size:10px; font-weight:700;
    border-radius:10px; padding:2px 7px; margin-top:4px;
    letter-spacing:.4px; text-transform:uppercase;
  }
  .badge-auto { background:#ede9fe; color:#5b3fd4; }
  .badge-bus  { background:#ccfbf1; color:#0f766e; }
  .badge-misto{ background:#f3e8ff; color:#7c3aed; }

  .card-info { padding:0 14px 10px 14px; display:flex; flex-direction:column; gap:5px; }
  .info-row { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); }
  .info-row svg { flex-shrink:0; opacity:.7; }

  /* ACTION BUTTONS */
  .card-actions { display:flex; gap:6px; padding:0 12px 12px; flex-wrap:wrap; }
  .act-btn {
    display:flex; align-items:center; gap:5px;
    border:none; border-radius:8px; padding:7px 12px;
    font-size:12px; font-weight:700; cursor:pointer; text-decoration:none;
    transition:filter .15s; white-space:nowrap;
  }
  .act-btn:hover { filter:brightness(1.1); }
  .btn-call  { background:#5b3fd4; color:#fff; }
  .btn-wa    { background:#25d366; color:#fff; }
  .btn-mail  { background:#f0f2f7; color:#374151; border:1px solid var(--border); }
  .btn-web   { background:#f0f2f7; color:#374151; border:1px solid var(--border); }

  .card-fleet { margin:0 12px 12px; padding:7px 10px; background:var(--bg); border-radius:8px; font-size:12px; color:var(--muted); }
  .card-fleet-label { font-weight:700; color:var(--text); font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }

  /* LOADING / EMPTY */
  .loading { text-align:center; padding:60px 20px; color:var(--muted); }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
  @keyframes spin{ to{transform:rotate(360deg)} }
  .empty { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-icon { font-size:44px; margin-bottom:12px; }

  /* LEAFLET POPUP CUSTOM */
  .popup-title { font-weight:700; font-size:14px; margin-bottom:6px; color:#1e2535; }
  .popup-sub { font-size:12px; color:#6b7280; margin-bottom:8px; }
  .popup-actions { display:flex; gap:5px; flex-wrap:wrap; }
  .popup-btn {
    display:inline-flex; align-items:center; gap:4px;
    border:none; border-radius:6px; padding:5px 10px;
    font-size:11px; font-weight:700; cursor:pointer; text-decoration:none;
    white-space:nowrap;
  }
  .p-call { background:#5b3fd4; color:#fff; }
  .p-wa   { background:#25d366; color:#fff; }
  .p-mail { background:#e5e7eb; color:#374151; }
</style>
</head>

    <div class="header-count" id="count-badge">— associati</div>
    <div class="view-toggle">
      <button class="view-btn active" id="btn-list" onclick="setView('list')" title="Lista">☰</button>
      <button class="view-btn" id="btn-map" onclick="setView('map')" title="Mappa">🗺</button>
    </div>
  </div>
  <div class="search-bar">
    <input type="search" id="search" placeholder="Cerca nome, comune, provincia…" autocomplete="off">
  </div>
  <div class="filters">
    <button class="filter-btn active" data-cat="all">Tutti</button>
    <button class="filter-btn" data-cat="2">🚗 Auto</button>
    <button class="filter-btn" data-cat="4">🚌 Bus</button>
    <button class="filter-btn" data-cat="6">🚐 Misto</button>
  </div>
</div>

<div class="region-bar" id="region-bar"></div>
<div class="results-info" id="results-info"></div>

<div id="map-container"><div id="map"></div></div>
<div id="cards-container">
  <div class="cards" id="cards">
    <div class="loading"><div class="spinner"></div>Caricamento associati…</div>
  </div>
</div>

<script>
const API = 'https://sistematrasporti.it/wp-json/wpgmza/v1/markers?map_id=1';
const CAT_LABEL = {'2':'Auto','4':'Bus','6':'Misto'};
const CAT_ICON  = {'2':'🚗','4':'🚌','6':'🚐'};
const CAT_BADGE = {'2':'badge-auto','4':'badge-bus','6':'badge-misto'};
const CAT_COLOR = {'2':'#5b3fd4','4':'#0f9688','6':'#7c3aed'};

let allData = [], activeCategory = 'all', activeRegion = 'all', searchQuery = '';
let currentView = 'list';
let leafletMap = null, markers = [];

function getField(item, name) {
  const f = (item.custom_field_data||[]).find(f=>f.name===name);
  return f ? f.value.replace(/<[^>]*>/g,'').trim() : '';
}
function getEmail(item) {
  const f = (item.custom_field_data||[]).find(f=>f.name==='E-mail');
  if(!f) return '';
  const m = f.value.match(/mailto:([^"]+)/);
  return m ? m[1].trim() : f.value.replace(/<[^>]*>/g,'').trim();
}
function getFleet(item) {
  const f = (item.custom_field_data||[]).find(f=>f.name==='Parco macchine');
  if(!f||!f.value) return '';
  return f.value.replace(/<br\s*\/?>/gi,', ').replace(/<[^>]*>/g,'').replace(/^,\s*/,'').trim();
}
function cleanTel(t) { return t.replace(/[^0-9+]/g,''); }

function actionButtons(item, cls='act-btn') {
  const tel   = getField(item,'Telefono');
  const email = getEmail(item);
  const telC  = tel ? cleanTel(tel) : '';
  let btns = '';
  if(telC) {
    btns += `<a class="${cls} btn-call p-call" href="tel:+39${telC}">📞 Chiama</a>`;
    btns += `<a class="${cls} btn-wa p-wa" href="https://wa.me/39${telC}" target="_blank">💬 WhatsApp</a>`;
  }
  if(email) {
    btns += `<a class="${cls} btn-mail p-mail" href="mailto:${email}">✉️ Email</a>`;
  }
  if(item.link && item.link.startsWith('http')) {
    btns += `<a class="${cls} btn-web p-mail" href="${item.link}" target="_blank" rel="noopener">🌐 Sito</a>`;
  }
  return btns;
}

function renderCard(item) {
  const comune  = getField(item,'Comune');
  const prov    = getField(item,'Provincia');
  const regione = getField(item,'Regione');
  const fleet   = getFleet(item);
  const cat     = item.category||'2';
  return `
  <div class="card cat-${cat}">
    <div class="card-top">
      <div class="cat-stripe"></div>
      <span class="card-icon">${CAT_ICON[cat]||'🚗'}</span>
      <div>
        <div class="card-title">${item.title||'—'}</div>
        <span class="card-badge ${CAT_BADGE[cat]||'badge-auto'}">${CAT_LABEL[cat]||cat}</span>
      </div>
    </div>
    <div class="card-info">
      ${comune||prov ? `<div class="info-row">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        ${[comune, prov?`(${prov})`:'' ,regione].filter(Boolean).join(' ')}
      </div>` : ''}
    </div>
    <div class="card-actions">${actionButtons(item,'act-btn')}</div>
    ${fleet ? `<div class="card-fleet"><div class="card-fleet-label">Parco mezzi</div>${fleet}</div>` : ''}
  </div>`;
}

function getFiltered() {
  const q = searchQuery.toLowerCase();
  return allData.filter(item => {
    const catMatch = activeCategory==='all' || item.category===activeCategory;
    const regMatch = activeRegion==='all' || getField(item,'Regione')===activeRegion;
    const srch = !q ||
      (item.title||'').toLowerCase().includes(q) ||
      getField(item,'Comune').toLowerCase().includes(q) ||
      getField(item,'Provincia').toLowerCase().includes(q) ||
      getField(item,'Regione').toLowerCase().includes(q);
    return catMatch && regMatch && srch;
  });
}

function renderCards() {
  const filtered = getFiltered();
  const container = document.getElementById('cards');
  document.getElementById('results-info').textContent =
    `${filtered.length} associat${filtered.length===1?'o':'i'} trovati`;
  if(!filtered.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>Nessun associato trovato</div>`;
    return;
  }
  container.innerHTML = filtered.map(renderCard).join('');
}

function renderMap() {
  const filtered = getFiltered();
  document.getElementById('results-info').textContent =
    `${filtered.length} associat${filtered.length===1?'o':'i'} trovati`;

  if(!leafletMap) {
    leafletMap = L.map('map').setView([44.5, 11.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'© OpenStreetMap contributors', maxZoom:18
    }).addTo(leafletMap);
  }

  markers.forEach(m => m.remove());
  markers = [];

  filtered.forEach(item => {
    const lat = parseFloat(item.lat), lng = parseFloat(item.lng);
    if(!lat||!lng) return;
    const cat = item.category||'2';
    const color = CAT_COLOR[cat]||'#5b3fd4';
    const comune  = getField(item,'Comune');
    const prov    = getField(item,'Provincia');
    const tel     = getField(item,'Telefono');
    const email   = getEmail(item);
    const telC    = tel ? cleanTel(tel) : '';

    const icon = L.divIcon({
      className:'',
      html:`<div style="width:28px;height:28px;background:${color};border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">${CAT_ICON[cat]||'🚗'}</div>`,
      iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-16]
    });

    const popupBtns = actionButtons(item,'popup-btn');
    const popup = `
      <div style="min-width:200px;max-width:260px">
        <div class="popup-title">${item.title||'—'}</div>
        <div class="popup-sub">${[comune,prov?`(${prov})`:''].filter(Boolean).join(' ')}</div>
        ${popupBtns ? `<div class="popup-actions">${popupBtns}</div>` : ''}
      </div>`;

    const m = L.marker([lat,lng],{icon}).bindPopup(popup,{maxWidth:280}).addTo(leafletMap);
    markers.push(m);
  });

  if(markers.length>0) {
    const group = L.featureGroup(markers);
    leafletMap.fitBounds(group.getBounds().pad(0.1));
  }

  setTimeout(()=>leafletMap.invalidateSize(),100);
}

function setView(v) {
  currentView = v;
  document.getElementById('map-container').style.display = v==='map' ? 'block' : 'none';
  document.getElementById('cards-container').style.display = v==='list' ? 'block' : 'none';
  document.getElementById('btn-list').classList.toggle('active', v==='list');
  document.getElementById('btn-map').classList.toggle('active', v==='map');
  if(v==='map') renderMap(); else renderCards();
}

function render() {
  if(currentView==='map') renderMap(); else renderCards();
}

function buildRegionBar(data) {
  const regions = [...new Set(data.map(d=>getField(d,'Regione')).filter(Boolean))].sort();
  const bar = document.getElementById('region-bar');
  bar.innerHTML = `<span class="region-chip active" data-region="all">Tutte</span>` +
    regions.map(r=>`<span class="region-chip" data-region="${r}">${r}</span>`).join('');
  bar.querySelectorAll('.region-chip').forEach(chip => {
    chip.addEventListener('click',()=>{
      activeRegion=chip.dataset.region;
      bar.querySelectorAll('.region-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      render();
    });
  });
}

async function init() {
  try {
    const res = await fetch(API);
    allData = (await res.json()).map(d=>({...d,category:String(d.category)}));
    document.getElementById('count-badge').textContent = `${allData.length} associati`;
    buildRegionBar(allData);
    document.querySelectorAll('.filter-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        activeCategory=btn.dataset.cat;
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });
    document.getElementById('search').addEventListener('input',e=>{
      searchQuery=e.target.value; render();
    });
    render();
  } catch(e) {
    document.getElementById('cards').innerHTML=
      `<div class="empty"><div class="empty-icon">⚠️</div>Errore nel caricamento.<br><small>${e.message}</small></div>`;
  }
}
init();
</script>
</body>
</html>
